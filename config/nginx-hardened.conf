# Nginx hardened configuration for WordPress
# This demonstrates edge security, rate limiting, and hardening

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=wp_login:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=wp_xmlrpc:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php;

    # ─────────────────────────────────────────
    # Security Headers
    # ─────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;

    # Remove server version
    server_tokens off;

    # ─────────────────────────────────────────
    # Rate Limiting on wp-login.php
    # ─────────────────────────────────────────
    location = /wp-login.php {
        limit_req zone=wp_login burst=3 nodelay;
        limit_req_status 429;

        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # ─────────────────────────────────────────
    # Block XML-RPC (brute force vector)
    # ─────────────────────────────────────────
    location = /xmlrpc.php {
        deny all;
        return 403;
    }

    # ─────────────────────────────────────────
    # Block PHP execution in uploads
    # ─────────────────────────────────────────
    location ~* /wp-content/uploads/.*\.php$ {
        deny all;
        return 403;
    }

    # ─────────────────────────────────────────
    # Deny access to sensitive files
    # ─────────────────────────────────────────
    location ~* /(wp-config\.php|readme\.html|license\.txt|\.htaccess|\.env) {
        deny all;
        return 404;
    }

    # Block hidden files
    location ~ /\. {
        deny all;
        return 404;
    }

    # ─────────────────────────────────────────
    # Block user enumeration via REST API
    # ─────────────────────────────────────────
    location ~* /wp-json/wp/v2/users {
        deny all;
        return 403;
    }

    # Block author enumeration
    if ($args ~* "author=\d+") {
        return 403;
    }

    # ─────────────────────────────────────────
    # Restrict wp-admin access by IP (optional)
    # ─────────────────────────────────────────
    # location /wp-admin/ {
    #     allow 192.168.1.0/24;  # Your office IP
    #     allow 10.0.0.0/8;      # VPN range
    #     deny all;
    #
    #     location ~ \.php$ {
    #         include fastcgi_params;
    #         fastcgi_pass php:9000;
    #         fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    #     }
    # }

    # ─────────────────────────────────────────
    # Standard WordPress handling
    # ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_intercept_errors on;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
