; PHP configuration for demo purposes
; Some settings intentionally insecure to demonstrate hardening

display_errors = On
expose_php = On
max_execution_time = 300
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M

; OPcache - enabled for caching demo
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 0
