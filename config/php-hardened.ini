; Hardened PHP configuration
; Apply this to show the difference

display_errors = Off
expose_php = Off
max_execution_time = 30
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 10M

; Disable dangerous functions
disable_functions = exec,shell_exec,system,passthru,popen,proc_open,curl_multi_exec,parse_ini_file,show_source,proc_nice,proc_terminate,proc_get_status,proc_close

; Restrict file access
open_basedir = /var/www/html:/tmp
allow_url_fopen = Off
allow_url_include = Off

; Session hardening
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1

; OPcache
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
